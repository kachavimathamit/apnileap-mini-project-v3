<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student — Mini-Project Portfolio Monitoring Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main>
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <div class="page-head">
        <h1 id="page-title"></h1>
        <p id="page-sub"></p>
      </div>

      <div class="grid grid--cards" id="grid"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const session = requireSession();
    const artifact = session && findArtifact(qs('aid'));
    if (!session) {
      // requireSession already redirected to the login page.
    } else if (!artifact) {
      document.body.innerHTML = '<p style="padding:2rem">No such artefact.</p>';
    } else {
      const theme = findTheme(artifact.tid);
      const fac = findFaculty(theme.fid);
      const dept = findDept(theme.did);
      const school = findSchool(dept.sid);
      const college = findCollege(school.cid);
      if (!authorize(session.scope, { cid: college.cid, did: dept.did, fid: fac.fid })) {
        renderTopbar('Student', session);
        denyAccess(session);
      } else {
        renderTopbar('Student', session);
        let trail;
        if (session.scope.level === 'faculty') {
          trail = [
            { label: fac.name, href: `theme.html?fid=${fac.fid}` },
            { label: theme.name, href: `artifact.html?tid=${theme.tid}` },
            { label: artifact.name },
          ];
        } else if (session.scope.level === 'dept') {
          trail = [
            { label: dept.name, href: `faculty.html?did=${dept.did}` },
            { label: fac.name, href: `theme.html?fid=${fac.fid}` },
            { label: theme.name, href: `artifact.html?tid=${theme.tid}` },
            { label: artifact.name },
          ];
        } else {
          trail = [
            { label: 'Programme portfolio', href: 'portfolio.html' },
            { label: college.name, href: `school.html?cid=${college.cid}` },
            { label: school.name, href: `dept.html?sid=${school.sid}` },
            { label: dept.name, href: `faculty.html?did=${dept.did}` },
            { label: fac.name, href: `theme.html?fid=${fac.fid}` },
            { label: theme.name, href: `artifact.html?tid=${theme.tid}` },
            { label: artifact.name },
          ];
        }
        renderBreadcrumbs(document.getElementById('breadcrumbs'), trail);

        document.getElementById('page-title').textContent = artifact.name;
        const students = studentsOf(artifact.aid);
        // Team size is a fixed rule (see TEAM_SIZE in data.js), not just
        // whatever the sample data happens to have - surface it honestly if
        // it's ever off, rather than silently showing a short-staffed team.
        document.getElementById('page-sub').textContent = students.length === TEAM_SIZE
          ? `Team of ${TEAM_SIZE} students working on this artefact — end of the trail.`
          : `${students.length} of ${TEAM_SIZE} students recorded — every team must be fixed at ${TEAM_SIZE}.`;

        // Leaf level — a plain card, not a link, since there is nothing below a student.
        document.getElementById('grid').innerHTML = students.map((s) => `
          <section class="card college-card">
            <h2>${s.name}</h2>
            <div class="campus">Department: ${findDept(s.did).name}</div>
          </section>
        `).join('') || '<p class="empty">No student recorded yet for this artefact.</p>';
      }
    }
  </script>
</body>
</html>
