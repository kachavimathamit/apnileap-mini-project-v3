<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Mini-Project Portfolio Monitoring Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="sub">Mini-Project Portfolio Monitoring Portal</p>

      <div class="alert alert--error" id="error-box" role="alert" hidden>
        <span id="error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn--primary" id="submit-btn">Sign in</button>
      </form>

      <div class="auth-foot">
        <a href="#">Forgotten your password?</a>
      </div>

      <div class="demo-accounts">
        <p>
          Not registered yet? <a href="#">Sign up here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // UI only — there is no real backend/session yet, so this is a
    // client-side credential check against the ROLES table in data.js, not
    // real authentication. Each role carries a scope (see data.js) that
    // every other page uses to decide what that signed-in role may see.
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      setTimeout(() => {
        const role = findRoleByCredentials(emailInput.value, passwordInput.value);

        if (role) {
          sessionStorage.setItem('apnileap_session', JSON.stringify({ role: role.role, email: role.email, scope: role.scope }));
          window.location.href = homeUrlFor(role.scope);
          return;
        }

        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        errorText.textContent = 'Email address or password is incorrect.';
        errorBox.hidden = false;
      }, 500);
    });
  </script>
</body>
</html>
