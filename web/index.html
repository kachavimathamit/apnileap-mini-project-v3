<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Mini-Project Portfolio Monitoring Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="sub">Mini-Project Portfolio Monitoring Portal</p>

      <div class="alert alert--error" id="error-box" role="alert" hidden>
        <span id="error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="captcha-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="captcha-answer">Verify you're human: <span id="captcha-question"></span></label>
          <div class="captcha-row">
            <input id="captcha-answer" name="captcha" type="text" inputmode="numeric" autocomplete="off" required />
            <button type="button" id="captcha-refresh" class="captcha-refresh" aria-label="Get a new question" title="Get a new question">&#8635;</button>
          </div>
        </div>
        <button type="submit" class="btn--primary" id="submit-btn">Sign in</button>
      </form>

      <div class="auth-foot">
        <a href="#">Forgotten your password?</a>
      </div>

      <div class="demo-accounts">
        <p>
          Not registered yet? <a href="#">Sign up here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // UI only — there is no real backend/session yet, so this is a
    // client-side credential check against the ROLES table in data.js, not
    // real authentication. Each role carries a scope (see data.js) that
    // every other page uses to decide what that signed-in role may see.
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Look-alike characters (0 vs O, 1 vs l) are invisible behind password
    // dots, so let the user reveal what they actually typed before submitting.
    const pwToggle = document.getElementById('pw-toggle');
    pwToggle.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      pwToggle.textContent = show ? 'Hide' : 'Show';
      pwToggle.setAttribute('aria-pressed', String(show));
      pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
    const captchaQuestion = document.getElementById('captcha-question');
    const captchaAnswerInput = document.getElementById('captcha-answer');
    const captchaRefreshBtn = document.getElementById('captcha-refresh');

    // Simple arithmetic CAPTCHA — there's no real backend to run a proper
    // one against, so this exists only as a UI speed bump against trivial
    // scripted submits, not real bot protection. A fresh pair of numbers is
    // generated on load and after every attempt, so an answer can't be reused.
    let captchaAnswer = 0;
    function newCaptcha() {
      const a = 1 + Math.floor(Math.random() * 10);
      const b = 1 + Math.floor(Math.random() * 10);
      captchaAnswer = a + b;
      captchaQuestion.textContent = `What is ${a} + ${b}?`;
      captchaAnswerInput.value = '';
    }
    captchaRefreshBtn.addEventListener('click', newCaptcha);
    newCaptcha();

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorBox.hidden = true;

      if (Number(captchaAnswerInput.value.trim()) !== captchaAnswer) {
        errorText.textContent = 'That answer is incorrect. Please solve the new question below.';
        errorBox.hidden = false;
        newCaptcha();
        captchaAnswerInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      setTimeout(() => {
        const role = findRoleByCredentials(emailInput.value, passwordInput.value);

        if (role) {
          sessionStorage.setItem('apnileap_session', JSON.stringify({ role: role.role, email: role.email, scope: role.scope }));
          window.location.href = homeUrlFor(role.scope);
          return;
        }

        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        errorText.textContent = 'Email address or password is incorrect.';
        errorBox.hidden = false;
        newCaptcha();
      }, 500);
    });
  </script>
</body>
</html>
