<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programme portfolio — Mini-Project Portfolio Monitoring Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main>
      <div class="page-head">
        <h1>Programme portfolio</h1>
        <p id="page-sub"></p>
      </div>

      <div class="grid grid--cards" id="college-grid"></div>

      <section class="card card--compact status-card" aria-label="Consolidated status">
        <h2>Consolidated status</h2>
        <div id="rag-legend-slot"></div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const session = requireSession();
    if (session) {
      // Department- and faculty-scoped roles have no portfolio to browse -
      // they're confined to one fixed branch of the hierarchy.
      if (isBranchScoped(session.scope)) {
        window.location.replace(homeUrlFor(session.scope));
      } else {
        renderTopbar('Programme portfolio', session);
        run(session);
      }
    }

    function run(session) {
    // Real RAG counts, rolled up from each artifact's status - set only by
    // the faculty mentor who owns it (see data.js: setArtifactStatus).
    function toRagArray(counts) {
      return [
        { label: 'Green', className: 'rag-dot--green', count: counts.green },
        { label: 'Yellow', className: 'rag-dot--yellow', count: counts.yellow },
        { label: 'Red', className: 'rag-dot--red', count: counts.red },
      ];
    }

    function renderRagLegend(counts, extraClass) {
      return `<div class="rag-legend ${extraClass}">${counts.map((r) => `
        <div class="rag-item">
          <span class="rag-dot ${r.className}" aria-hidden="true"></span>
          <span class="rag-item__count">${r.count}</span>
          <span class="rag-item__label">${r.label}</span>
        </div>
      `).join('')}</div>`;
    }

    const colleges = collegesInScope(session.scope);
    document.getElementById('page-sub').textContent =
      `${colleges.length} authorized college${colleges.length === 1 ? '' : 's'}. Select one to drill down to schools, departments and students.`;

    const grid = document.getElementById('college-grid');
    grid.innerHTML = colleges.map((c) => `
      <a class="card college-card link-card" href="school.html?cid=${c.cid}">
        <h2>${c.name}</h2>
        <div class="campus">${c.campus} Campus</div>
        ${renderRagLegend(toRagArray(ragCounts(artifactsUnderCollege(c.cid))), 'rag-legend--mini')}
      </a>
    `).join('');

    // Consolidated status covers only the colleges this role is authorized to see.
    const consolidated = colleges.reduce((totals, c) => {
      const counts = ragCounts(artifactsUnderCollege(c.cid));
      totals.red += counts.red; totals.yellow += counts.yellow; totals.green += counts.green;
      return totals;
    }, { red: 0, yellow: 0, green: 0 });
    document.getElementById('rag-legend-slot').innerHTML = renderRagLegend(toRagArray(consolidated), 'rag-legend--center');
    }
  </script>
</body>
</html>
