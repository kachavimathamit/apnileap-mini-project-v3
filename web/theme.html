<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themes — Mini-Project Portfolio Monitoring Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <main>
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <div class="page-head">
        <h1 id="page-title"></h1>
        <p id="page-sub"></p>
      </div>

      <div class="grid grid--cards" id="grid"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    const fac = findFaculty(qs('fid'));
    if (!fac) {
      document.body.innerHTML = '<p style="padding:2rem">No such faculty member.</p>';
    } else {
      const dept = findDept(fac.did);
      const school = findSchool(dept.sid);
      const college = findCollege(school.cid);
      renderTopbar('Themes');
      renderBreadcrumbs(document.getElementById('breadcrumbs'), [
        { label: 'Programme portfolio', href: 'portfolio.html' },
        { label: college.name, href: `school.html?cid=${college.cid}` },
        { label: school.name, href: `dept.html?sid=${school.sid}` },
        { label: dept.name, href: `faculty.html?did=${dept.did}` },
        { label: fac.name },
      ]);

      document.getElementById('page-title').textContent = fac.name;
      const themes = themesOf(fac.fid);
      document.getElementById('page-sub').textContent =
        `${themes.length} project theme${themes.length === 1 ? '' : 's'}. Select one to see its artifact.`;

      document.getElementById('grid').innerHTML = themes.map((t) => cardLink(
        `artifact.html?tid=${t.tid}`, t.name, `${artifactsOf(t.tid).length} artefact${artifactsOf(t.tid).length === 1 ? '' : 's'}`,
      )).join('') || '<p class="empty">No theme recorded yet for this faculty member.</p>';
    }
  </script>
</body>
</html>
